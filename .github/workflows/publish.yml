name: Publish

# Publishes @melt3d/nonplanar-slicer-mcp to npm and lists it on the MCP
# Registry (server.json) when a tag `v<version>` is pushed. The version must
# match package.json, server.json (both places) and VERSION in src/server.ts:
# bump them, merge, then tag main.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# It can also be run by hand (Actions, Publish, Run workflow) on main, for
# the version package.json names. A version already on npm is not published
# again, so a run that failed after npm, or a version published by hand,
# still gets its MCP Registry listing.
#
# npm: trusted publishing (OIDC), so no npm token is stored. The package's
# settings on npmjs.com name this workflow as its trusted publisher (GitHub
# Actions, Melt-3D/nonplanar-slicer-mcp, publish.yml). npm allows it only on
# GitHub-hosted runners, and attaches provenance since the repo is public.
#
# MCP Registry: `mcp-publisher login github-oidc` proves the workflow runs in
# a Melt-3D repository, which owns the io.github.Melt-3D/ namespace.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # npm's trusted publishing and the MCP Registry's login both use it.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: npm and MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships 10.
      - run: npm install -g npm@11.6.2

      - name: Every file names the same version, and the tag names it too
        run: |
          package="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="${GITHUB_REF_NAME#v}"; else tag="$package"; fi
          server_json="$(node -p "const s = require('./server.json'); [s.version, ...s.packages.map((p) => p.version)].join(' ')")"
          code="$(sed -n "s/^export const VERSION = '\(.*\)';$/\1/p" src/server.ts)"
          for v in $package $server_json $code; do
            if [ "$v" != "$tag" ]; then
              echo "::error::tag v$tag, but package.json says $package, server.json $server_json, src/server.ts $code"
              exit 1
            fi
          done

      - run: npm ci
      - run: npm test
      - name: Publish to npm, unless this version is there already
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@melt3d/nonplanar-slicer-mcp@$version" version >/dev/null 2>&1; then
            echo "$version is on npm already: not published again"
          else
            npm publish --access public
          fi

      - name: List it on the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
